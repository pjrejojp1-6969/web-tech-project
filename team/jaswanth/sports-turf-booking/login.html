<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportZone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            min-height: 100vh;
        }
        /* NAVBAR */
        .navbar {
            background: #111827;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: #22c55e;
            font-size: 25px;
            font-weight: bold;
        }
        .home-btn {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid #22c55e;
            border-radius: 8px;
        }
        .home-btn:hover {
            background: #22c55e;
        }
        /* CONTAINER */
        .container {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        /* LOGIN BOX */
        .login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .logo-icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
        .login-box h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
        }
        /* PASSWORD */
        .password-box {
            position: relative;
        }
        .password-box input {
            padding-right: 70px;
        }
        .show-password {
            position: absolute;
            right: 10px;
            top: 12px;
            border: none;
            background: none;
            color: #22c55e;
            cursor: pointer;
            font-weight: bold;
        }
        /* BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .login-btn:hover {
            background: #16a34a;
        }
        /* SWITCH */
        .switch {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }
        .switch button {
            border: none;
            background: none;
            color: #16a34a;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        /* FORGOT */
        .forgot {
            text-align: right;
            margin-top: 8px;
            margin-bottom: 18px;
        }
        .forgot button {
            border: none;
            background: none;
            color: #16a34a;
            cursor: pointer;
        }
        /* REGISTER */
        #registerForm {
            display: none;
        }
        /* MESSAGE */
        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .success {
            background: #dcfce7;
            color: #166534;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        /* FOOTER */
        footer {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
        }
        /* MOBILE */
        @media(max-width: 600px) {
            .login-box {
                padding: 25px;
            }
            .navbar {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            ⚽ SportZone
        </div>
        <a href="index.html" class="home-btn">
            Home
        </a>
    </nav>
    <!-- CONTAINER -->
    <div class="container">
        <!-- LOGIN -->
        <div class="login-box">
            <!-- LOGIN FORM -->
            <div id="loginForm">
                <div class="logo-icon">
                    ⚽
                </div>
                <h1>Welcome Back</h1>
                <p class="subtitle">
                    Login to your SportZone account
                </p>
                <div id="loginMessage" class="message"></div>
                <form onsubmit="loginUser(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-box">
                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >
                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('loginPassword')"
                            >
                                Show
                            </button>
                        </div>
                    </div>
                    <div class="forgot">
                        <button
                            type="button"
                            onclick="forgotPassword()"
                        >
                            Forgot Password?
                        </button>
                    </div>
                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Login
                    </button>
                </form>
                <div class="switch">
                    Don't have an account?
                    <button onclick="showRegister()">
                        Create Account
                    </button>
                </div>
            </div>
            <!-- REGISTER -->
            <div id="registerForm">
                <div class="logo-icon">
                    🏆
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">
                    Join SportZone today
                </p>
                <div id="registerMessage" class="message"></div>
                <form onsubmit="registerUser(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your name"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input
                            type="tel"
                            id="registerPhone"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-box">
                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create password"
                                required
                            >
                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('registerPassword')"
                            >
                                Show
                            </button>
                        </div>
                    </div>
                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Create Account
                    </button>
                </form>
                <div class="switch">
                    Already have an account?
                    <button onclick="showLogin()">
                        Login
                    </button>
                </div>
            </div>
        </div>
    </div>
    <footer>
        © 2026 SportZone. All Rights Reserved.
    </footer>
    <script>
        /* SHOW LOGIN */
        function showLogin() {
            document.getElementById("loginForm").style.display =
                "block";
            document.getElementById("registerForm").style.display =
                "none";
        }
        /* SHOW REGISTER */
        function showRegister() {
            document.getElementById("loginForm").style.display =
                "none";
            document.getElementById("registerForm").style.display =
                "block";
        }
        /* REGISTER */
        function registerUser(event) {
            event.preventDefault();
            let name =
                document.getElementById("registerName").value;
            let email =
                document.getElementById("registerEmail").value;
            let phone =
                document.getElementById("registerPhone").value;
            let password =
                document.getElementById("registerPassword").value;
            let user = {
                name: name,
                email: email,
                phone: phone,
                password: password
            };
            localStorage.setItem(
                "sportzoneUser",
                JSON.stringify(user)
            );
            showMessage(
                "registerMessage",
                "Account created successfully! Please login.",
                "success"
            );
            setTimeout(function() {
                showLogin();
                document.getElementById("loginEmail").value =
                    email;
            }, 1200);
        }
        /* LOGIN */
        function loginUser(event) {
            event.preventDefault();
            let email =
                document.getElementById("loginEmail").value;
            let password =
                document.getElementById("loginPassword").value;
            let savedUser =
                JSON.parse(
                    localStorage.getItem("sportzoneUser")
                );
            if (!savedUser) {
                showMessage(
                    "loginMessage",
                    "No account found. Please create an account first.",
                    "error"
                );
                return;
            }
            if (
                email === savedUser.email &&
                password === savedUser.password
            ) {
                localStorage.setItem(
                    "sportzoneLoggedIn",
                    "true"
                );
                localStorage.setItem(
                    "sportzoneCurrentUser",
                    JSON.stringify(savedUser)
                );
                showMessage(
                    "loginMessage",
                    "Login successful! Redirecting...",
                    "success"
                );
                setTimeout(function() {
                    window.location.href =
                        "booking.html";
                }, 1000);
            } else {
                showMessage(
                    "loginMessage",
                    "Incorrect email or password.",
                    "error"
                );
            }
        }
        /* PASSWORD */
        function togglePassword(id) {
            let input =
                document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
        /* FORGOT PASSWORD */
        function forgotPassword() {
            alert(
                "Password recovery will be connected to email service later."
            );
        }
        /* MESSAGE */
        function showMessage(id, text, type) {
            let message =
                document.getElementById(id);
            message.innerText = text;
            message.className =
                "message " + type;
            message.style.display =
                "block";
        }
    </script>
</body>
</html>
