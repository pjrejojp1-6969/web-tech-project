<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - SportZone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f4f7fb;
            color: #222;
        }
        /* NAVBAR */
        .navbar {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 25px;
            font-weight: bold;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }
        .navbar a:hover {
            color: #22c55e;
        }
        /* HEADER */
        .page-header {
            background: linear-gradient(135deg, #16a34a, #0f766e);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }
        .page-header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }
        .page-header p {
            font-size: 17px;
        }
        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }
        /* SUMMARY */
        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .summary-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            flex: 1;
            min-width: 200px;
        }
        .summary-box h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .summary-box p {
            font-size: 25px;
            font-weight: bold;
            color: #16a34a;
        }
        /* BOOKING CARD */
        .booking-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }
        .booking-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .booking-top h2 {
            color: #111827;
        }
        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .detail {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
        }
        .detail strong {
            display: block;
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .detail span {
            font-weight: bold;
            color: #111827;
        }
        .booking-bottom {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .amount {
            font-size: 22px;
            font-weight: bold;
            color: #16a34a;
        }
        .cancel-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }
        .cancel-btn:hover {
            background: #dc2626;
        }
        /* EMPTY */
        .empty {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }
        .empty h2 {
            margin-bottom: 10px;
        }
        .empty p {
            color: #666;
            margin-bottom: 20px;
        }
        .book-btn {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }
        .clear-btn {
            background: #111827;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            margin-bottom: 25px;
        }
        .clear-btn:hover {
            background: #374151;
        }
        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }
        /* MOBILE */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            .navbar a {
                margin: 5px;
                display: inline-block;
            }
            .page-header h1 {
                font-size: 30px;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .booking-bottom {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">
        ⚽ SportZone
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="turfs.html">Turfs</a>
        <a href="sports.html">Sports</a>
        <a href="booking.html">Book Now</a>
        <a href="bookings.html">My Bookings</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>
<!-- HEADER -->
<section class="page-header">
    <h1>📋 My Bookings</h1>
    <p>View and manage your turf bookings</p>
</section>
<!-- MAIN -->
<div class="container">
    <div class="summary">
        <div class="summary-box">
            <h3>Total Bookings</h3>
            <p id="totalBookings">0</p>
        </div>
        <div class="summary-box">
            <h3>Total Amount</h3>
            <p id="totalAmount">₹0</p>
        </div>
    </div>
    <button class="clear-btn" onclick="clearBookings()">
        🗑️ Clear All Bookings
    </button>
    <div id="bookingList"></div>
</div>
<!-- FOOTER -->
<footer>
    <p>© 2026 SportZone | Turf & Sports Booking System</p>
</footer>
<script>
    function createDetail(label, value) {
        const detail = document.createElement("div");
        detail.className = "detail";

        const heading = document.createElement("strong");
        heading.textContent = label;
        const text = document.createElement("span");
        text.textContent = value ?? "-";

        detail.append(heading, text);
        return detail;
    }

    function loadBookings() {
        const bookings =
            JSON.parse(localStorage.getItem("bookings")) || [];
        const bookingList =
            document.getElementById("bookingList");
        document.getElementById("totalBookings").textContent =
            bookings.length;
        let total = 0;
        bookings.forEach(booking => {
            total += Number(booking.total) || 0;
        });
        document.getElementById("totalAmount").textContent =
            "₹" + total;
        if (bookings.length === 0) {
            bookingList.innerHTML = `
                <div class="empty">
                    <h2>📭 No Bookings Yet</h2>
                    <p>
                        You haven't booked any turf yet.
                    </p>
                    <a href="booking.html" class="book-btn">
                        ⚽ Book a Turf
                    </a>
                </div>
            `;
            return;
        }
        bookingList.innerHTML = "";
        bookings.forEach((booking, index) => {
            const card = document.createElement("div");
            card.className = "booking-card";
            const top = document.createElement("div");
            top.className = "booking-top";
            const title = document.createElement("h2");
            title.textContent = `🏟️ ${booking.turf || "Turf booking"}`;
            const status = document.createElement("span");
            status.className = "status";
            status.textContent = booking.status || "Confirmed";
            top.append(title, status);

            const details = document.createElement("div");
            details.className = "details";
            details.append(
                createDetail("Booking ID", booking.id || `SZ${index + 1}`),
                createDetail("Sport", booking.sport),
                createDetail("Date", booking.date),
                createDetail("Time", booking.time),
                createDetail("Hours", `${booking.hours ?? "-"} Hour(s)`),
                createDetail("Customer", booking.name),
                createDetail("Phone", booking.phone),
                createDetail("Email", booking.email)
            );

            const bottom = document.createElement("div");
            bottom.className = "booking-bottom";
            const amount = document.createElement("div");
            amount.className = "amount";
            amount.textContent = `₹${booking.total ?? 0}`;
            const cancelButton = document.createElement("button");
            cancelButton.className = "cancel-btn";
            cancelButton.textContent = "Cancel Booking";
            cancelButton.addEventListener("click", () => cancelBooking(index));
            bottom.append(amount, cancelButton);

            card.append(top, details, bottom);
            bookingList.appendChild(card);
        });
    }
    function cancelBooking(index) {
        if (!confirm("Are you sure you want to cancel this booking?")) {
            return;
        }
        let bookings =
            JSON.parse(localStorage.getItem("bookings")) || [];
        bookings.splice(index, 1);
        localStorage.setItem(
            "bookings",
            JSON.stringify(bookings)
        );
        loadBookings();
    }
    function clearBookings() {
        if (!confirm("Delete all bookings?")) {
            return;
        }
        localStorage.removeItem("bookings");
        loadBookings();
    }
    loadBookings();
</script>
</body>
</html>
