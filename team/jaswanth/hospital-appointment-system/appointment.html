<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments | Modern Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
<header class="navbar">
    <div class="logo">Modern Hospital</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="doctor.html">Doctors</a>
        <a href="services.html">Services</a>
        <a href="appointment.html">Appointment</a>
        <a href="my-appointments.html">My Appointments</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>
<main>
<section id="appointment" class="section">

    <div class="section-title">

        <h2>
            Book an Appointment
        </h2>

        <p>
            Schedule your visit with our doctors
        </p>

    </div>


    <div class="form-container">

        <form onsubmit="submitAppointment(event)">

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <select id="doctor" name="doctor" required>

                <option value="">
                    Select Doctor
                </option>

                <option>
                    Dr. Rajesh Kumar - Cardiologist
                </option>

                <option>
                    Dr. Priya Sharma - General Physician
                </option>

                <option>
                    Dr. Arjun Reddy - Orthopedic Specialist
                </option>

            </select>

            <input
                type="date"
                id="date"
                name="date"
                required
            >

            <textarea
                id="problem"
                name="problem"
                placeholder="Describe your problem"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Submit Appointment
            </button>

        </form>

    </div>

    <p class="appointment-storage-note">
        Submitted appointments are saved in this browser on this device.
        <a href="my-appointments.html">View My Appointments</a>
    </p>

</section>
</main>
<footer>
    <p>&#169; 2026 Modern Hospital | All Rights Reserved</p>
</footer>
<script src="script.js"></script>
</body>
</html>
