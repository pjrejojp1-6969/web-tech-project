<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav">
  <a class="logo" href="#/">STREAMBOX</a>
  <div class="links" id="links"></div>
  <div class="sp"></div>
  <input id="q" placeholder="Search titles" aria-label="Search">
  <button class="ib" id="sb" aria-label="Search">🔍</button>
  <button class="ib" id="bell" aria-label="Notifications">🔔</button>
  <div class="dd">
    <button class="ib" id="pb" aria-label="Profile">👤 ▾</button>
    <div class="menu" id="pm">
      <a href="#/account">Account</a><a href="#/mylist">My List</a><a href="#/help">Help Center</a><a id="auth"></a>
    </div>
  </div>
</nav>
<main id="app"></main>
<footer id="foot"></footer>

<div class="modal" id="modal"><div class="mb" id="mb"></div></div>
<div class="player" id="player">
  <button class="x" id="px">×</button>
  <h2 id="pt"></h2><div class="bar"><i id="pbar"></i></div><p id="pst">Playing…</p>
  <div><button class="btn g" id="pp">Pause</button></div>
</div>
<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
